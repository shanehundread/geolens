<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoLens</title>

<link rel="stylesheet" href="css/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- NAV -->
<nav class="top-nav">
  <div class="logo">GeoLens</div>

  <div class="nav-actions">
    <input id="searchInput" placeholder="Search countries..." />

    <select id="regionFilter">
      <option value="">All Regions</option>
    </select>

    <button id="themeToggle">🌙 Dark</button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Discover the <span>World</span></h1>
  <p>Explore countries with real-time data</p>
</section>

<!-- MAIN -->
<main class="container">
  <div id="loading" class="loading">Loading countries...</div>
  <div id="countriesGrid" class="grid"></div>
</main>

<script src="js/countries.js"></script>
<script src="js/app.js"></script>

</body>
</html>
