<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GeoLens - Details</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com"></script>

<!-- LEAFLET -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body {
  background: #020617;
  font-family: Inter;
  color: white;
}

.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
}

#map {
  width: 100%;
  height: 300px;
  border-radius: 12px;
}
</style>

</head>

<body>

<!-- NAV -->
<nav class="fixed top-5 left-1/2 -translate-x-1/2 w-[90%] max-w-4xl flex justify-between items-center px-6 py-3 rounded-full glass z-50">
  <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">
    GeoLens
  </h1>

  <a href="index.html" class="text-sm hover:text-cyan-400">← Back</a>
</nav>

<!-- HERO -->
<section class="h-[50vh] relative flex items-end p-10">
  <img id="heroImg" class="absolute inset-0 w-full h-full object-cover opacity-40">

  <div class="relative z-10">
    <h1 id="countryName" class="text-5xl font-bold"></h1>
    <p id="regionText" class="opacity-70 mt-2"></p>
  </div>
</section>

<!-- CONTENT -->
<section class="p-8 max-w-6xl mx-auto grid md:grid-cols-2 gap-8">

  <!-- LEFT -->
  <div class="space-y-6">

    <div class="glass p-6 rounded-xl">
      <h2 class="text-xl mb-3">Basic Info</h2>
      <p><b>Capital:</b> <span id="capital"></span></p>
      <p><b>Region:</b> <span id="region"></span></p>
      <p><b>Subregion:</b> <span id="subregion"></span></p>
    </div>

    <div class="glass p-6 rounded-xl">
      <h2 class="text-xl mb-3">Population</h2>
      <p id="population"></p>
    </div>

    <!-- CURRENCY (LEFT SIDE) -->
    <div class="glass p-6 rounded-xl">
      <h2 class="text-xl mb-3">Currencies</h2>
      <div id="currencies"></div>
    </div>

    <div class="glass p-6 rounded-xl">
      <h2 class="text-xl mb-3">Languages</h2>
      <div id="languages"></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="space-y-6">

    <!-- MAP -->
    <div class="glass p-4 rounded-xl">
      <h2 class="text-xl mb-3">Map</h2>
      <div id="map"></div>
    </div>

    <!-- GOOGLE MAP BUTTON (BELOW MAP) -->
    <div class="glass p-6 rounded-xl">
      <a id="mapLink" target="_blank"
         class="block text-center py-3 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500">
        🌍 View on Google Maps
      </a>
    </div>

  </div>

</section>

<script>
let map;

async function loadCountry() {
  const code = new URLSearchParams(window.location.search).get('code');
  if (!code) return;

  const res = await fetch('/api/countries/' + code);
  const c = await res.json();

  // HERO
  document.getElementById('heroImg').src = c.flags.svg;
  document.getElementById('countryName').textContent = c.name.common;
  document.getElementById('regionText').textContent = c.region;

  // INFO
  document.getElementById('capital').textContent = c.capital?.[0] || 'N/A';
  document.getElementById('region').textContent = c.region;
  document.getElementById('subregion').textContent = c.subregion || 'N/A';
  document.getElementById('population').textContent = c.population.toLocaleString();

  // LANGUAGES
  document.getElementById('languages').innerHTML =
    c.languages ? Object.values(c.languages).map(l => `<p>${l}</p>`).join('') : 'N/A';

  // CURRENCIES
  document.getElementById('currencies').innerHTML =
    c.currencies ? Object.values(c.currencies).map(cur => `<p>${cur.name} (${cur.symbol || ''})</p>`).join('') : 'N/A';

  // MAP LINK
  const lat = c.latlng?.[0] || 0;
  const lng = c.latlng?.[1] || 0;
  document.getElementById('mapLink').href = `https://www.google.com/maps?q=${lat},${lng}`;

  // MAP INIT
  if (map) map.remove();

  map = L.map('map').setView([lat, lng], 4);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  L.marker([lat, lng]).addTo(map)
    .bindPopup(c.name.common)
    .openPopup();
}

loadCountry();
</script>

</body>
</html>
